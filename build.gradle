plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
base { archivesName = 'building-palette' }
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
loom {
    splitEnvironmentSourceSets()
    mods { building_palette { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:clutternomore:AQkLCaPY"
    localRuntime "maven.modrinth:clutternomore:AQkLCaPY"
    localRuntime "maven.modrinth:offgrid:H4rTCX81"

}
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { from('LICENSE') }
// Pure model tests run without booting Minecraft.
tasks.register('modelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.jensh.buildingpalette.ModelTest'
    enableAssertions = true
}
check.dependsOn modelTest

// The model suite is a Java assertion runner; Minecraft integration uses Fabric GameTest.
tasks.named('test') { enabled = false }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'building_palette_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Test fixture configuration is copied into the disposable run directory immediately before launch.
tasks.named('runClientGameTest') {
    jvmArgs '-Dfabric.noGui=true'

    def fixtureMods = providers.gradleProperty('rpgMods')
    if (fixtureMods.isPresent()) {
        dependsOn 'harnessAgent'
        jvmArgs '-Dbuilding_palette.rpg_test=true'
        jvmArgs '-javaagent:' + layout.buildDirectory.file("libs/building-palette-${version}-test-agent.jar").get().asFile.absolutePath
    }
    def testDirectory = layout.buildDirectory.dir('run/clientGameTest')
    doFirst {
        def directory = testDirectory.get().asFile
        def destinationMods = new File(directory, 'mods')
        destinationMods.mkdirs()
        destinationMods.eachFile { old -> if (old.isFile()) old.delete() }
        if (fixtureMods.isPresent()) {
            def sourceMods = new File(fixtureMods.get())
            sourceMods.eachFile { source ->
                if (source.name.endsWith('.jar') && !source.name.startsWith('CrashAssistant-') && !source.name.startsWith('clutternomore-')
                        && !source.name.startsWith('offgrid-') && !source.name.startsWith('fabric-api-')
                        && !source.name.startsWith('building-palette-')) {
                    java.nio.file.Files.copy(source.toPath(), new File(destinationMods, source.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            def sourcePacks = new File(sourceMods.absoluteFile.parentFile, 'frozenlib/downloaded_resourcepacks')
            if (sourcePacks.isDirectory()) {
                def destinationPacks = new File(directory, 'frozenlib/downloaded_resourcepacks')
                destinationPacks.mkdirs()
                sourcePacks.eachFile { source ->
                    if (source.isFile()) java.nio.file.Files.copy(source.toPath(), new File(destinationPacks, source.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            def sourceConfig = new File(sourceMods.absoluteFile.parentFile, 'config')
            if (sourceConfig.isDirectory()) {
                sourceConfig.eachFileRecurse { source ->
                    if (source.isFile()) {
                        def relative = sourceConfig.toPath().relativize(source.toPath())
                        def target = new File(directory, 'config').toPath().resolve(relative)
                        java.nio.file.Files.createDirectories(target.parent)
                        java.nio.file.Files.copy(source.toPath(), target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }
            }
        }
        def options = new File(directory, 'options.txt')
        options.parentFile.mkdirs()
        options.text = 'soundCategory_master:0.0\nfullscreen:false\nrenderDistance:6\nsimulationDistance:5\n'
    }
}

// Never included in the mod jar: matches normal FrozenLib startup in a development test launch.
sourceSets { harness { java.srcDir 'src/harness/java' } }
tasks.register('harnessAgent', Jar) {
    dependsOn harnessClasses
    archiveClassifier = 'test-agent'
    from sourceSets.harness.output
    manifest { attributes 'Premain-Class': 'dev.jensh.buildingpalette.harness.FrozenLibTestAgent' }
}
