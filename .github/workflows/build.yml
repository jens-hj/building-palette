name: Build and server tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test shared model
        run: ./gradlew --no-daemon :common:check :${{ matrix.loader }}:build
      - name: Fabric server tests
        if: matrix.loader == 'fabric'
        run: ./gradlew --no-daemon :fabric:runGameTest
      - name: NeoForge server tests
        if: matrix.loader == 'neoforge'
        run: ./gradlew --no-daemon :neoforge:runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: building-palette-${{ matrix.loader }}
          path: |
            build/libs/*-fabric.jar
            neoforge/build/libs/*-neoforge.jar
