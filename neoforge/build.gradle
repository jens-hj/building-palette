plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.modrinth.minotaur' version '2.10.0'
}
java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(21) }
base { archivesName = 'building-palette' }
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
// Extra mods for a run, e.g. the jars of a modpack instance: -PextraMods=/path/to/mods
def extraMods = providers.gradleProperty('extraMods').map { fileTree(it) { include '*.jar' } }
def clientRunDirectory = rootProject.file('build/run/clientTest')
neoForge {
    version = project.neo_version
    mods {
        building_palette { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main }
        building_palette_test { sourceSet sourceSets.testmod }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'; sourceSet = sourceSets.testmod
            gameDirectory = rootProject.file('build/run/gameTest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'building_palette'
        }
        clientTest {
            client(); sourceSet = sourceSets.testmod; gameDirectory = clientRunDirectory
            systemProperty 'building_palette.client_test', 'true'
            systemProperty 'building_palette.previews', rootProject.file('build/previews').absolutePath
            systemProperty 'building_palette.test_result', rootProject.file('build/client-result.json').absolutePath
        }
    }
}
dependencies {
    implementation project(':common')
    implementation "maven.modrinth:clutternomore:${project.clutternomore_version}"
    implementation "maven.modrinth:offgrid:${project.offgrid_version}"
    compileOnly "maven.modrinth:omnivault:${project.omnivault_version}"
    if (providers.gradleProperty('neoOmniVault').isPresent()) runtimeOnly "maven.modrinth:omnivault:${project.omnivault_version}"
    if (extraMods.isPresent()) runtimeOnly extraMods.get()
}
tasks.withType(Jar).configureEach { from(rootProject.file('LICENSE')) }
tasks.named('jar') {
    archiveClassifier = 'neoforge'
    from(project(':common').sourceSets.main.output)
}
tasks.named('sourcesJar') { archiveClassifier = 'neoforge-sources'; from(project(':common').sourceSets.main.allSource) }
def releaseVersion = project.version.toString()
processResources {
    inputs.property 'version', releaseVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}

// Graphical runs open on the desktop unless wrapped in scripts/headless-test.py; keep them silent.
tasks.named('runClientTest') {
    doFirst {
        def directory = clientRunDirectory
        directory.mkdirs()
        new File(directory, 'options.txt').text = 'soundCategory_master:0.0\nsoundCategory_music:0.0\nfullscreen:false\nrenderDistance:6\nsimulationDistance:5\nonboardAccessibility:false\nnarrator:0\npauseOnLostFocus:false\ntutorialStep:none\n'
        def config = new File(directory, 'config/building_palette.json'); config.parentFile.mkdirs(); config.text = '{"placementPreview":false,"precisePlacement":false}\n'
    }
}

// Same publishing workflow as the other Minecraft projects. Credentials remain external.
def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(
    providers.fileContents(rootProject.layout.projectDirectory.file(
        "${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })
def currentChangelog = providers.fileContents(rootProject.layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
    def section = text.split(/(?m)^## /).find { it.startsWith("${version}\n") || it.startsWith("${version}\r") }
    section ? section.substring(section.indexOf('\n') + 1).trim() : ''
}
modrinth {
    token = modrinthToken
    projectId = 'hBaJZHIg'
    versionNumber = "${project.version}+${project.minecraft_version}-neoforge"
    versionName = "${project.version} (NeoForge ${project.minecraft_version})"
    versionType = 'alpha'
    environment = 'client_and_server'
    uploadFile = jar
    additionalFiles { sourcesJar(tasks.named('sourcesJar')) }
    gameVersions = [project.minecraft_version]
    loaders = ['neoforge']
    changelog = currentChangelog
    dependencies {
        optional.project 'omnivault'
        required.version project.clutternomore_version
        required.version project.offgrid_version
    }
}
tasks.named('modrinth') { notCompatibleWithConfigurationCache('Minotaur reads Task.project') }
