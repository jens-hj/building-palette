plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
neoForge { neoFormVersion = project.neoform_version }
java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDir 'src/client/java'
dependencies {
    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    // Offgrid is a required dependency; its world API is loader-neutral.
    compileOnly "maven.modrinth:offgrid:${project.offgrid_version}"
    // Optional compat; its storage classes are loader-neutral.
    compileOnly "maven.modrinth:omnivault:${project.omnivault_version}"
}
tasks.register('modelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.jensh.buildingpalette.ModelTest'
    enableAssertions = true
}
tasks.named('test') { enabled = false }
check.dependsOn modelTest
