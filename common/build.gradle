plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
neoForge { neoFormVersion = '26.3-1' }
java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(25) }
sourceSets.main.java.srcDir 'src/client/java'
dependencies {
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
    // Offgrid is a required dependency on both loaders; its world API is loader-neutral.
    compileOnly 'maven.modrinth:offgrid:Dh9cO38a'
    // Optional compat; its storage classes are loader-neutral.
    compileOnly 'maven.modrinth:omnivault:UHlYyKKQ'
}
tasks.register('modelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.jensh.buildingpalette.ModelTest'
    enableAssertions = true
}
tasks.named('test') { enabled = false }
check.dependsOn modelTest
tasks.matching { it.name == 'downloadAssets' }.configureEach {
    javaExecutable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }
}
